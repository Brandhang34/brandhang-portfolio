name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v4
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      -
        # Must match the templ runtime in go.mod. Installing @latest against an
        # older runtime produces generated code that calls functions the library
        # does not have (undefined: templ.JoinURLErrs).
        name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ)
      -
        name: Generate templ
        run: templ generate
      -
        name: Check go.mod is tidy
        run: go mod tidy -diff
      -
        name: Vet
        run: go vet ./...
      -
        name: Test
        run: go test ./... -race
      -
        name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      -
        # The Dockerfile does not run Tailwind, so production serves whatever
        # output.css is committed. This fails the build if the committed CSS is
        # stale relative to input.css and the templates.
        name: Check committed CSS is up to date
        run: |
          curl -sL https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.3/tailwindcss-linux-x64 -o tailwindcss
          chmod +x tailwindcss
          ./tailwindcss -i cmd/web/assets/css/input.css -o cmd/web/assets/css/output.css
          if ! git diff --quiet -- cmd/web/assets/css/output.css; then
            echo "cmd/web/assets/css/output.css is stale. Run 'make build' and commit the result."
            git diff -- cmd/web/assets/css/output.css
            exit 1
          fi

  docker:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v4
      -
        name: Login to Docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Tagging by SHA as well as latest gives a concrete rollback target.
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERIMAGE_NAME }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERIMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
